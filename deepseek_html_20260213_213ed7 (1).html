<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>💘 you + me = valentine 💘</title>
    <style>
        /* reset & base — both pages share same love vibes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #ffd9e8 0%, #ffecf0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 1rem;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }
        /* floating hearts (same for both pages) */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .floating-hearts span {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.15;
            user-select: none;
            animation: floatAround 14s infinite linear;
            color: #ff99aa;
        }
        @keyframes floatAround {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0.2; }
            100% { transform: translateY(-10vh) rotate(400deg); opacity: 0; }
        }

        /* main card — shared style */
        .valentine-card {
            max-width: 680px;
            width: 100%;
            background: rgba(255, 248, 245, 0.95);
            backdrop-filter: blur(6px);
            border-radius: 4rem 2.5rem 4rem 2.5rem;
            box-shadow: 0 30px 50px rgba(220, 80, 120, 0.3), 0 8px 20px rgba(0,0,0,0.1);
            padding: 2.8rem 2rem 3.5rem;
            text-align: center;
            border: 3px solid #ffb8b8;
            position: relative;
            z-index: 20;
            transition: 0.3s;
        }

        h1 {
            font-size: 3rem;
            color: #b13e55;
            text-shadow: 3px 3px 0 #ffc5ce;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }
        .sub-question {
            font-size: 2rem;
            background: #ffe2e8;
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 60px;
            color: #a53f55;
            margin-bottom: 2.5rem;
            border: 1px solid #ffa0b5;
        }
        .button-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1.8rem;
            margin: 2.5rem 0 1.8rem;
        }
        .btn {
            border: none;
            font-size: 2.4rem;
            font-weight: 700;
            padding: 1.2rem 2.8rem;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 10px 0 #ad3b52, 0 10px 25px rgba(190, 60, 80, 0.5);
            min-width: 220px;
            background: #ff8a9f;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 2px solid #fff6f6;
            transition: all 0.1s ease;
            transform: translateY(0);
            text-decoration: none;
        }
        .btn-yes {
            background: #ff4d6d;
            box-shadow: 0 10px 0 #b32e4a, 0 12px 28px #ff99aa;
        }
        .btn-yes:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0 #b32e4a, 0 12px 28px #ff99aa;
        }
        .btn-no {
            background: #f5c2c2;
            color: #4d2f2f;
            box-shadow: 0 10px 0 #a56f7a, 0 8px 20px #e2a5a5;
        }
        .btn-no:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0 #a56f7a, 0 8px 20px #e2a5a5;
        }
        .secret-note {
            margin-top: 2rem;
            font-size: 1.3rem;
            background: #ffe5e5;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            display: inline-block;
            color: #a5485e;
            border: 1px solid #ffb3b3;
        }

        /* mobile fine-tune */
        @media (max-width: 550px) {
            h1 { font-size: 2.4rem; }
            .sub-question { font-size: 1.6rem; }
            .btn { font-size: 2rem; min-width: 180px; padding: 1rem 1.5rem; }
            .button-panel { gap: 1rem; }
            .valentine-card { padding: 2rem 1rem; }
        }
        @media (max-width: 380px) {
            .btn { font-size: 1.8rem; min-width: 150px; }
        }

        /* ---------- PAGE 2 (cat celebration) ---------- */
        .cat-page-card {
            max-width: 750px;
            background: #fffaf7;
            border-radius: 5rem 3rem 5rem 3rem;
            padding: 2.5rem 2rem 3.5rem;
            border: 4px solid #ffafc0;
        }
        .cat-emoji {
            font-size: 8rem;
            line-height: 1.2;
            filter: drop-shadow(0 20px 18px #fba5b5);
            display: inline-block;
            animation: jump 0.9s infinite alternate ease-in-out;
            transform-origin: bottom;
            cursor: default;
            margin: 0.5rem 0 1rem;
        }
        @keyframes jump {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-28px) scale(1.1); text-shadow: 0 30px 15px #fca5b5; }
        }
        .happy-cat-title {
            font-size: 2.8rem;
            color: #b3435a;
            text-shadow: 2px 2px 0 #ffccd4;
            margin: 0.3rem 0 1rem;
        }
        .cat-message {
            font-size: 1.8rem;
            background: #ffeaee;
            padding: 1.2rem 1.8rem;
            border-radius: 60px;
            margin: 1.8rem 0;
            border: 2px dashed #ff809a;
            color: #a1354d;
            word-break: break-word;
        }
        
        /* new silent email status (very discreet) */
        .silent-email-status {
            font-size: 1.3rem;
            color: #b34e63;
            background: #ffe8ec;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            margin: 1.5rem auto 0.5rem;
            display: inline-block;
            border: 1px solid #ffa5b5;
            opacity: 0.9;
        }
        .back-link {
            display: inline-block;
            margin-top: 2rem;
            font-size: 1.5rem;
            color: #b14b62;
            text-decoration: none;
            border-bottom: 3px dotted #ffa5b5;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- background floating hearts (both pages) -->
    <div class="floating-hearts" aria-hidden="true">
        <span style="left: 5%; animation-delay: 0s;">❤️</span>
        <span style="left: 25%; animation-delay: 3s;">💖</span>
        <span style="left: 45%; animation-delay: 1.2s;">💗</span>
        <span style="left: 65%; animation-delay: 5s;">💘</span>
        <span style="left: 85%; animation-delay: 2.5s;">💞</span>
        <span style="left: 15%; animation-delay: 4s;">💕</span>
        <span style="left: 75%; animation-delay: 6s;">💓</span>
        <span style="left: 35%; animation-delay: 2s;">🧡</span>
    </div>

    <!-- MAIN PAGE (QUESTION) – hidden when cat page shown -->
    <div id="questionPage" class="valentine-card" style="display: block;">
        <div style="font-size: 3.5rem; margin-bottom: 0.2rem;">💌🥰</div>
        <h1>VALENTINE'S DAY</h1>
        <div class="sub-question">only one question...</div>

        <div class="button-panel">
            <button class="btn btn-yes" id="yesBtn">YES 💝</button>
            <button class="btn btn-no" id="noBtn">no 🥺</button>
        </div>

        <!-- hidden response for "no" attempts (just for fun) -->
        <div id="funnyMessage" style="font-size: 1.7rem; color:#b13e55; background: #ffe2e2; border-radius: 60px; padding: 1rem; margin-top: 1.5rem; display: none;"></div>

        <div class="secret-note">
            ✨ (the cutest answer gets a jumping cat) ✨
        </div>
    </div>

    <!-- CAT CELEBRATION PAGE (initially hidden) -->
    <div id="catPage" class="valentine-card cat-page-card" style="display: none;">
        <div class="cat-emoji" aria-label="happy jumping cat">😻📬</div>
        <div class="happy-cat-title">meow‑valentine!</div>
        <div class="cat-message" id="catMessage">you said YES! happy cat is jumping for joy</div>
        
        <!-- subtle notification that an email was sent in the background -->
        <div id="emailNotice" class="silent-email-status">💌 i sent myself an email with your answer! (no typing needed)</div>

        <a href="#" id="backToQuestion" class="back-link">← go back (if you want)</a>
    </div>

    <script>
        (function() {
            // ----- page elements -----
            const questionPage = document.getElementById('questionPage');
            const catPage = document.getElementById('catPage');
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const funnyDiv = document.getElementById('funnyMessage');
            const catMessage = document.getElementById('catMessage');
            const emailNotice = document.getElementById('emailNotice');
            const backLink = document.getElementById('backToQuestion');

            // ----- helper: hide funny message -----
            function clearFunny() {
                if (funnyDiv) funnyDiv.style.display = 'none';
            }

            // ----- function to silently send an email (in background) -----
            function sendSilentEmail() {
                // Replace with YOUR real email address (the one you want to receive the answer)
                const yourEmail = 'your.valentine@example.com'; // 🔴 CHANGE THIS TO YOUR REAL EMAIL
                
                // Subject & body (the answer)
                const subject = '💘 Someone said YES to be your Valentine! 💘';
                const body = `Guess what? The person just clicked YES! They want to be your Valentine! 🐱💖 (happy cat is jumping)`;
                
                // Create a mailto link – this will open the user's default email app,
                // but it's the most "background" we can do on a static page.
                // It's not truly silent (the mail app will pop up), but that's the only way to send email from static HTML.
                // We'll make it as unobtrusive as possible: we open a tiny hidden iframe? 
                // Actually mailto MUST be triggered by user click, and it opens the email client.
                // To be truly "in the background" we can't avoid the mail app appearing, but we can use a trick:
                // Use a hidden iframe to load the mailto, so the page doesn't navigate away.
                // However, many browsers will still open a new tab or popup for mailto.
                // I'll use a hidden iframe approach to make it feel less disruptive.
                
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = `mailto:${encodeURIComponent(yourEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                document.body.appendChild(iframe);
                
                // Remove iframe after a short delay (it already did its job)
                setTimeout(() => {
                    if (iframe.parentNode) iframe.remove();
                }, 500);
                
                // Update the notice to show that we tried to notify you
                emailNotice.innerText = '💌 I let them know! (email draft opened silently)';
            }

            // ----- yes button : switch to cat page AND trigger silent email -----
            yesBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Send the silent email (background)
                sendSilentEmail();
                
                // Switch view
                questionPage.style.display = 'none';
                catPage.style.display = 'block';
                
                // Update cat message
                catMessage.innerText = '🎉 you said YES! happy cat is jumping for joy! 🐾';
            });

            // ----- no button with playful messages (never leaves question page) -----
            let noClickCount = 0;
            const noMessages = [
                "🙈 oops! but you really mean YES, right?",
                "💔 heart temporarily broken... try YES!",
                "🐱 cat is sad... click YES to make him jump!",
                "📬 that answer cannot be delivered – press YES",
                "💘 nice joke! now for real: click the pink button!",
                "🥺 be my valentine? (the YES button is waiting)"
            ];

            noBtn.addEventListener('click', function(e) {
                e.preventDefault();
                noClickCount++;
                if (noClickCount >= 3) {
                    funnyDiv.innerText = "⭐ you win! but i know you meant YES... try again? ⭐";
                    noClickCount = 0;
                } else {
                    const randomMsg = noMessages[Math.floor(Math.random() * noMessages.length)];
                    funnyDiv.innerText = randomMsg;
                }
                funnyDiv.style.display = 'block';
                // tiny animation on no button
                noBtn.style.transform = 'scale(0.9)';
                setTimeout(() => noBtn.style.transform = '', 150);
            });

            // ----- back link from cat page to question -----
            backLink.addEventListener('click', function(e) {
                e.preventDefault();
                catPage.style.display = 'none';
                questionPage.style.display = 'block';
                funnyDiv.style.display = 'none';
                noClickCount = 0;
                // reset notice text in case they come back and click yes again
                emailNotice.innerText = '💌 i sent myself an email with your answer! (no typing needed)';
            });

            // optional: if they click yes again after going back, it will send another email (that's fine)
        })();
    </script>
    <!-- IMPORTANT: you must replace 'your.valentine@example.com' in the JavaScript with your real email address.
         Search for that string in the code (line ~280) and put your actual email there. -->
</body>
</html>
